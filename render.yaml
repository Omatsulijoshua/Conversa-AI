services:
  # Database Service (PostgreSQL)
  - type: db
    name: conversa-db
    databaseName: conversa_db
    user: conversa_admin

  # Backend Web Service (NestJS)
  - type: web
    name: conversa-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && node dist/prisma/seed.js && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: conversa-db
          property: connectionString
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: AI_KEY_ENCRYPTION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: ${CONVERSA_CLIENT_URL}

  # Client Frontend Web Service (Next.js)
  - type: web
    name: conversa-client
    runtime: node
    rootDir: client_frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: ${CONVERSA_BACKEND_URL}/api/v1

  # Admin Dashboard Web Service (Next.js)
  - type: web
    name: conversa-admin
    runtime: node
    rootDir: admin_dashboard
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: ${CONVERSA_BACKEND_URL}/api/v1
